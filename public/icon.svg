<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="rpfBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rpfBadgeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="rpfLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#rpfBgGlow)"/>

  <!-- Premium Red Rounded Badge (rx=112) -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#rpfBadgeFill)" stroke="#FCA5A5" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Hand-drawn Oval Loop Hand-sketch style matching user request -->
  <g transform="translate(32, 32) scale(4.48)">
    <path
      d="M 42 22 C 24 36, 20 62, 34 78 C 48 92, 76 86, 84 62 C 90 38, 72 20, 46 19 C 36 18, 28 22, 24 28"
      fill="none"
      stroke="url(#rpfLoopGrad)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Directional Return Arrowhead at Top Lobe -->
    <path
      d="M 34 16 L 22 27 L 32 35"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Optical Accent Node -->
    <circle cx="48" cy="20" r="3.5" fill="#FEF2F2"/>
  </g>
</svg>
